# Stage C: joint fusion on the mixed corpus with modality dropout 0.3.
# Initialize from Stage A/B weights with --init-from (or start from scratch
# for ablation). The adversarial term is enabled only in this stage.
inherit: base.yaml

train:
  epochs: 40
  modality_dropout: 0.3
  lambda_perc: 0.15
  lambda_adv: 0.01
